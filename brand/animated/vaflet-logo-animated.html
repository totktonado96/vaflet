<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaflet logo, animated</title>
<style>
  :root { --bg: #fff; --ink: #000; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); display: grid; place-items: center; overflow: hidden; }
  body.dark { --bg: #000; --ink: #fff; }
  .logo { position: relative; width: min(84vw, calc(84vh * 581.14 / 146.70)); aspect-ratio: 581.14 / 146.70; cursor: crosshair; }
  .logo canvas { position: absolute; left: 0; top: 0; width: calc(100% * 146.7 / 581.14); height: 100%; }
  .logo svg { position: absolute; overflow: visible;
    left: calc(100% * (146.7 + 24.44) / 581.14); top: calc(100% * 18.33 / 146.70);
    width: calc(100% * 410 / 581.14); height: calc(100% * 110 / 146.70); }
  .hint { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; font: 12px/1.4 system-ui, sans-serif; color: var(--ink); opacity: .45; }
  .render .hint { display: none; }
</style>
</head>
<body>
<div class="logo" aria-label="Vaflet">
  <canvas></canvas>
  <svg viewBox="-4 0 410 110" aria-hidden="true">
    <defs>
      <path id="w" d="M48.24 80L24.71 80L1.03 9.69L19.97 9.69L37.01 69.16L35.79 69.16L52.88 9.69L71.83 9.69L48.24 80ZM88.04 80L69.05 80L94.93 9.69L118.27 9.69L144.05 80L125.05 80L106.50 21.36L88.04 80ZM125.25 62.32L87.65 62.32L87.65 48.26L125.25 48.26L125.25 62.32ZM164.36 80L146.74 80L146.74 9.69L197.42 9.69L197.42 24.68L164.36 24.68L164.36 37.18L192.98 37.18L192.98 52.17L164.36 52.17L164.36 80ZM253.09 80L202.11 80L202.11 9.69L219.74 9.69L219.74 65.01L253.09 65.01L253.09 80ZM309.05 80L257.39 80L257.39 9.69L308.37 9.69L308.37 24.68L275.02 24.68L275.02 36.10L302.90 36.10L302.90 50.31L275.02 50.31L275.02 65.01L309.05 65.01L309.05 80ZM352.41 80L334.79 80L334.79 24.68L310.03 24.68L310.03 9.69L377.22 9.69L377.22 24.68L352.41 24.68L352.41 80Z"/>
      <pattern id="h" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4.5" height="9" fill="var(--ink)"/></pattern>
      <mask id="m" maskUnits="userSpaceOnUse" x="-20" y="-20" width="470" height="160">
        <g id="copies" fill="#fff"></g>
        <use href="#w" fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
      </mask>
    </defs>
    <rect x="-20" y="-20" width="470" height="160" fill="url(#h)" mask="url(#m)"/>
    <use href="#w" fill="var(--ink)"/>
  </svg>
</div>
<p class="hint">Move the pointer over the logo: the light follows it. Add ?dark for the white-on-black version.</p>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  if (q.has("dark")) document.body.classList.add("dark");
  if (q.has("render")) document.body.classList.add("render");
  if (q.has("transparent")) document.body.style.background = "transparent";
  const dark = q.has("dark");

  // ---- word: 16 offset copies make the hatched block shadow
  const STEPS = 16, LEN = 23, REST = -0.95;
  const g = document.getElementById("copies");
  const copies = Array.from({ length: STEPS }, () => {
    const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
    u.setAttribute("href", "#w"); g.appendChild(u); return u;
  });
  const placeWord = a => {
    const dx = Math.cos(a), dy = -Math.sin(a);
    copies.forEach((u, i) => { const s = ((i + 1) / STEPS) * LEN; u.setAttribute("x", (dx * s).toFixed(2)); u.setAttribute("y", (dy * s).toFixed(2)); });
  };

  // ---- mark: the engraved sphere shader from the site
  const canvas = document.querySelector("canvas");
  const gl = canvas.getContext("webgl", { premultipliedAlpha: true, alpha: true, preserveDrawingBuffer: true });
  const VS = "attribute vec2 a; varying vec2 vUv; void main(){ vUv=a*0.5+0.5; gl_Position=vec4(a,0.0,1.0); }";
  const FS = `precision highp float;
uniform float uLight; uniform vec2 uRes; uniform float uInk; varying vec2 vUv;
float fill(float d, float aa){ return 1.0-smoothstep(-aa,aa,d); }
void main(){
  vec2 c=vUv-0.5; float aa=1.5/uRes.y; vec2 dir=vec2(cos(uLight),sin(uLight));
  vec2 q=c-vec2(-0.045,0.05); float R=0.38; float r=length(q);
  float inside=fill(r-R,aa);
  float z=sqrt(max(R*R-dot(q,q),0.0))/R;
  float lam=clamp(dot(vec3(q/R,z),normalize(vec3(-dir,0.75))),0.0,1.0);
  float u=q.y/(R*sqrt(max(1.0-(q.x/R)*(q.x/R),0.03)));
  float f=abs(fract(u*5.5+0.5)-0.5)*2.0;
  float th=mix(1.05,0.06,pow(lam,0.8));
  float lines=1.0-smoothstep(th-0.12,th+0.12,f);
  float rim=inside*(1.0-fill(r-R+0.02,aa));
  float ground=fill(length(q-dir*0.1)-R*0.97,aa)*smoothstep(0.02,0.035,r-R);
  float hatch=smoothstep(-0.3,0.3,sin((c.x-c.y)*6.2831/0.09));
  float k=max(inside*max(lines,rim),ground*hatch);
  gl_FragColor=vec4(vec3(uInk*k),k);
}`;
  const p = gl.createProgram();
  for (const [t, s] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, FS]]) { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); gl.attachShader(p, sh); }
  gl.bindAttribLocation(p, 0, "a"); gl.linkProgram(p); gl.useProgram(p);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const uL = gl.getUniformLocation(p, "uLight"), uR = gl.getUniformLocation(p, "uRes");
  gl.uniform1f(gl.getUniformLocation(p, "uInk"), dark ? 1 : 0);
  const resize = () => {
    const d = Math.min(3, devicePixelRatio || 1);
    canvas.width = Math.round(canvas.clientWidth * d); canvas.height = Math.round(canvas.clientHeight * d);
    gl.viewport(0, 0, canvas.width, canvas.height); gl.uniform2f(uR, canvas.width, canvas.height);
  };
  resize(); addEventListener("resize", resize);
  const draw = a => { placeWord(a); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); gl.uniform1f(uL, a); gl.drawArrays(gl.TRIANGLES, 0, 3); };

  // a seamless loop for video export: one full swing of the light in 6 s
  window.renderAt = t => draw(REST + 0.55 * Math.sin((2 * Math.PI * t) / 6));
  if (q.has("render")) { window.renderAt(0); return; }

  // live: the light drifts, and follows the pointer while it is over the logo
  const logo = document.querySelector(".logo");
  let hover = 0, target = 0, pointer = 0.5;
  logo.addEventListener("pointerenter", () => { target = 1; });
  logo.addEventListener("pointerleave", () => { target = 0; });
  logo.addEventListener("pointermove", e => { const r = logo.getBoundingClientRect(); pointer = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); });
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const t0 = performance.now();
  const loop = now => {
    if (!still) requestAnimationFrame(loop);
    hover += (target - hover) * 0.07;
    const drift = REST + (still ? 0 : 0.55 * Math.sin(((now - t0) / 1000) * 0.35));
    draw(drift + (pointer * 1.1 - Math.PI / 2 - drift) * hover);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
